name: E2E Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dev-stack

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          COMPOSE_FILE: local.yml

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f local.yml logs --tail=100

  # Screenshots the pull request and its base on the same runner and fails on
  # any changed page. A styling change is meant to fail it, so it should not
  # be a required check.
  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2

      - uses: ./.github/actions/dev-stack

      - name: Compare against the base branch
        id: compare
        run: inv test-visual --baseline=HEAD^1

      # A pull request from a fork gets a read-only token.
      - name: Comment with the changed screenshots
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        run: .github/scripts/comment_visual_changes.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.compare.outcome }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 14

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f local.yml logs --tail=100
