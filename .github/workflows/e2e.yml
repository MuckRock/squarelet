name: E2E Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dev-stack

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          COMPOSE_FILE: local.yml

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f local.yml logs --tail=100

  # Screenshots the pull request and its base on the same runner. A changed
  # page leaves a pending "Visual changes" status on the head commit that only
  # the next push replaces, so it should not be a required check.
  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      statuses: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2

      - uses: ./.github/actions/dev-stack

      # Playwright fails on a changed screenshot too, so the report step
      # decides whether the job fails. A fork's read-only token can neither
      # upload nor set the status, so its run fails on any change.
      - name: Compare against the base branch
        id: compare
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: inv test-visual --baseline=HEAD^1

      - name: Configure AWS credentials
        if: steps.compare.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Report the changed screenshots
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/comment_visual_changes.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.compare.outcome }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 14

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f local.yml logs --tail=100
