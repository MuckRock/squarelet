name: Dev stack
description: Start the local.yml Docker services at dev.squarelet.com with Playwright's Chromium installed.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install invoke
      shell: bash
      run: pip install invoke

    - uses: actions/setup-node@v4
      with:
        node-version-file: ".node-version"
        cache: "npm"

    - name: Install npm dependencies
      shell: bash
      run: npm ci

    - name: Install Playwright browsers
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Add hosts entries
      shell: bash
      run: |
        echo "127.0.0.1 dev.squarelet.com" | sudo tee -a /etc/hosts
        echo "127.0.0.1 dev.mailhog.com" | sudo tee -a /etc/hosts
        echo "127.0.0.1 minio.documentcloud.org" | sudo tee -a /etc/hosts

    - name: Generate environment files
      shell: bash
      run: python initialize_dotenvs.py

    - name: Generate self-signed certificates
      shell: bash
      run: |
        mkdir -p config/certs
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout config/certs/rootCA-key.pem \
          -out config/certs/rootCA.pem \
          -subj "/CN=Test Root CA"
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout config/certs/dev.squarelet.com-key.pem \
          -out config/certs/dev.squarelet.com.pem \
          -subj "/CN=dev.squarelet.com" \
          -addext "subjectAltName=DNS:dev.squarelet.com,DNS:*.dev.documentcloud.org,DNS:dev.muckrock.com,DNS:dev.foiamachine.org,DNS:dev.mailhog.com,DNS:minio.documentcloud.org"

    - name: Build and start services
      shell: bash
      run: docker compose -f local.yml up -d --build

    - name: Wait for services to be ready
      shell: bash
      run: |
        echo "Waiting for Django to be ready..."
        timeout 120 bash -c '
          until curl -sk -o /dev/null -w "%{http_code}" https://dev.squarelet.com/accounts/login/ | grep -qE "200|302"; do
            echo "Still waiting..."
            sleep 3
          done
        '
        echo "Django is ready"
